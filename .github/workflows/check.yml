name: TRADE ACADEMY - Mobile Check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm install
      - name: Expo Doctor
        run: npx expo-doctor
